<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="现代机械风 Web 工具站：Markdown 阅读器、图片处理、编解码等，全部在浏览器内完成，无需后端。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tools.tobenot.top/" />
    <meta property="og:title" content="Mecha Tools | 现代机械风 Web 工具站" />
    <meta property="og:description" content="现代机械风 Web 工具站：Markdown 阅读器、图片处理、编解码等，全部在浏览器内完成，无需后端。" />
    <meta property="og:image" content="https://tools.tobenot.top/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      内容安全策略：XSS 防御的最后一道防线。
      即便渲染层的 DOMPurify 被绕过，这里也能阻断脚本执行与数据外发。

      要点：
      - script-src 不含 'unsafe-inline'，因此内联事件处理器（onerror= / onload=）无法执行；
        页面自身那段防 FOUC 的内联脚本靠 sha256 哈希放行。
        改动该脚本后必须同步更新哈希，`npm run check:csp` 会校验。
      - connect-src 白名单化，阻断把凭证 fetch/XHR 外发到任意域名。
      - object-src 'none' + base-uri 'self' 阻断 <object> 与 <base> 注入。
      - style-src 需要 'unsafe-inline'：站内多处使用 <style> 块与内联样式。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net 'sha256-3nMKDGgQe5s2iCt1QnDd1hOhCwviu6Y5KXXVqE5SRTI=';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://kroki.io https://api.jiejiariapi.com https://cdn.jsdelivr.net;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'none';
        frame-src 'none';
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2064%2064'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='30' font-weight='800' fill='white'%3EM%3C/text%3E%3C/svg%3E" />
    <title>Mecha Tools | 现代机械风 Web 工具站</title>
  </head>

  <body class="min-h-screen bg-white dark:bg-gray-900 text-mech-text dark:text-gray-100 antialiased">
    <div id="root"></div>
    <script>
      // 旧哈希路由兼容：仅在根路径时，把 #tool / #tool?params 改写成 /tool#params。
      // 保历史书签与已分享卡片不断；分享 payload 仍留在 fragment，lz 编码逐字保留。
      try{if(location.pathname.replace(/\/+$/,'')===''){var h=location.hash;if(h.length>1){var raw=h.slice(1),qi=raw.indexOf('?'),p=qi<0?raw:raw.slice(0,qi),q=qi<0?'':raw.slice(qi+1);if(/^[a-z0-9-]+$/i.test(p))history.replaceState(null,'','/'+p+(q?'#'+q:''))}}}catch(e){}
      // Prevent FOUC: apply dark mode before React loads
      try{const t=localStorage.getItem('mecha-theme');if(t==='dark'||(t==null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}
      // Register service worker
      if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
