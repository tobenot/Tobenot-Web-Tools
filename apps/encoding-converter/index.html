<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2064%2064'%3E%3Crect width='64' height='64' rx='14' fill='%237c3aed'/%3E%3Cpath d='M12 16h40M12 48h40' stroke='rgba(255,255,255,.35)' stroke-width='4' stroke-linecap='round'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='800' fill='%23fff'%3E码%3C/text%3E%3C/svg%3E" />
  <title>文件编码转换 | Mecha Tools</title>
  <link rel="stylesheet" href="/src/index.css" />
  <style>
    .drop {
      border: 2px dashed #d1d5db; border-radius: 8px; padding: 36px 16px; text-align: center;
      cursor: pointer; background: #f9fafb;
    }
    .drop:hover, .drop.dragover { border-color: #7c3aed; background: #f5f3ff; }
    #fileInput { display: none; }
    .preview {
      font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-wrap;
      background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px;
      max-height: 280px; overflow: auto;
    }
  </style>
</head>

<body class="min-h-screen bg-mech-bg text-mech-text antialiased">
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <header class="sticky top-0 z-30 border-b border-mech-edge/70 backdrop-blur bg-mech-bg/70 -mx-4 px-4 py-3">
      <div class="flex items-center justify-between">
        <a class="font-semibold tracking-wider hover:text-black" href="/">Mecha Tools</a>
        <a class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 text-mech-text transition-colors" href="/">返回首页</a>
      </div>
    </header>

    <section class="bg-mech-panel border border-mech-edge rounded-xl shadow-subtle p-6 space-y-5">
      <div>
        <h1 class="text-xl font-semibold tracking-wide">文件编码转换</h1>
        <p class="text-mech-muted mt-2">检测并读取 GBK / Big5 / Shift_JIS 等源编码，写出 UTF-8 或 UTF-16。浏览器无法编码为 GBK。</p>
      </div>

      <div id="dropArea" class="drop">
        <p>拖拽或点击选择文本文件</p>
        <p class="text-sm text-mech-muted mt-1">代码、配置、日志、Markdown 等</p>
        <input type="file" id="fileInput">
      </div>

      <p id="status" class="text-sm hidden"></p>

      <div id="workArea" class="space-y-4 hidden">
        <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
          <dt class="text-mech-muted">文件名</dt><dd id="fileName"></dd>
          <dt class="text-mech-muted">大小</dt><dd id="fileSize"></dd>
          <dt class="text-mech-muted">检测编码</dt><dd id="detectedEncoding"></dd>
        </dl>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="text-sm font-medium">源编码
            <select id="sourceEncoding" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2">
              <option value="utf-8">UTF-8</option>
              <option value="gbk">GBK</option>
              <option value="gb2312">GB2312</option>
              <option value="big5">Big5</option>
              <option value="shift_jis">Shift_JIS</option>
              <option value="windows-1252">Windows-1252</option>
              <option value="iso-8859-1">ISO-8859-1</option>
              <option value="us-ascii">US-ASCII</option>
              <option value="utf-16le">UTF-16LE</option>
              <option value="utf-16be">UTF-16BE</option>
            </select>
          </label>
          <label class="text-sm font-medium">目标编码
            <select id="targetEncoding" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2">
              <option value="utf-8" selected>UTF-8</option>
              <option value="utf-16le">UTF-16LE</option>
              <option value="utf-16be">UTF-16BE</option>
              <option value="us-ascii">US-ASCII</option>
            </select>
          </label>
        </div>

        <div class="flex flex-wrap gap-2">
          <button id="convertBtn" class="px-4 py-2 rounded-md bg-violet-600 hover:bg-violet-700 text-white">转换并下载</button>
          <button id="resetBtn" class="px-4 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50">重新开始</button>
        </div>

        <div>
          <p class="text-sm font-medium mb-2">预览（前 20 行）</p>
          <div id="previewContent" class="preview"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const COMMON_CJK = '的一是在不了有和人这中大为上个国我以要他时来用们生到作地于出就分对成会可主发年动同工也能下过子说产种面而方后多定行学法所民得经十三之进着等部度家电力里如水化高自二理起小物现实加量都两体制机当使点从业本去把性好应开它合还因由其些然前外天政四日那社义事平形相全表间样与关各重新线内数正心反你明看原'
    const commonSet = new Set(COMMON_CJK)

    const dropArea = document.getElementById('dropArea')
    const fileInput = document.getElementById('fileInput')
    const statusEl = document.getElementById('status')
    const workArea = document.getElementById('workArea')
    const sourceEncoding = document.getElementById('sourceEncoding')
    const targetEncoding = document.getElementById('targetEncoding')
    const previewContent = document.getElementById('previewContent')

    let currentFile = null
    let currentBytes = null
    let detectedConfidence = null
    let detectedNote = ''

    function showStatus(message, ok) {
      statusEl.textContent = message
      statusEl.className = 'text-sm ' + (ok ? 'text-green-700' : 'text-red-600')
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B'
      const k = 1024
      const sizes = ['B', 'KB', 'MB', 'GB']
      const i = Math.min(sizes.length - 1, Math.floor(Math.log(bytes) / Math.log(k)))
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i]
    }

    function tryDecode(bytes, encoding, fatal) {
      try {
        return new TextDecoder(encoding, fatal ? { fatal: true } : undefined).decode(bytes)
      } catch {
        return null
      }
    }

    function guessUtf16WithoutBom(bytes) {
      const sampleLength = Math.min(bytes.length, 8192)
      let zeroEven = 0
      let zeroOdd = 0
      for (let i = 0; i < sampleLength; i++) {
        if (bytes[i] === 0) {
          if ((i & 1) === 0) zeroEven++
          else zeroOdd++
        }
      }
      const evenSlots = Math.ceil(sampleLength / 2)
      const oddSlots = Math.floor(sampleLength / 2)
      const evenRatio = evenSlots > 0 ? zeroEven / evenSlots : 0
      const oddRatio = oddSlots > 0 ? zeroOdd / oddSlots : 0
      if (evenRatio > 0.35 && oddRatio < 0.10) return { encoding: 'utf-16be', confidence: Math.min(1, evenRatio) }
      if (oddRatio > 0.35 && evenRatio < 0.10) return { encoding: 'utf-16le', confidence: Math.min(1, oddRatio) }
      return null
    }

    function scoreDecodedText(text) {
      const sample = text.length > 20000 ? text.slice(0, 20000) : text
      let replacementCount = 0
      let controlCount = 0
      let cjkCount = 0
      let asciiPrintableCount = 0
      let commonCount = 0
      for (let i = 0; i < sample.length; i++) {
        const code = sample.charCodeAt(i)
        if (code === 0xFFFD) { replacementCount++; continue }
        if (code === 0x09 || code === 0x0A || code === 0x0D) { asciiPrintableCount++; continue }
        if (code < 0x20) { controlCount++; continue }
        if (code >= 0x20 && code <= 0x7E) { asciiPrintableCount++; continue }
        if (code >= 0x4E00 && code <= 0x9FFF) {
          cjkCount++
          if (commonSet.has(sample[i])) commonCount++
          continue
        }
        if (commonSet.has(sample[i])) commonCount++
      }
      const length = sample.length || 1
      return commonCount * 6 + cjkCount * 0.8 + asciiPrintableCount * 0.05 + ((asciiPrintableCount + cjkCount) / length) * 120 - replacementCount * 80 - controlCount * 15
    }

    function scoreToConfidence(scoreDiff) {
      if (!Number.isFinite(scoreDiff) || scoreDiff <= 0) return 0
      return 1 - Math.exp(-Math.min(300, scoreDiff) / 80)
    }

    function detectEncoding(bytes) {
      detectedConfidence = null
      detectedNote = ''
      if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
        detectedConfidence = 1
        return 'utf-8'
      }
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
        detectedConfidence = 1
        return 'utf-16le'
      }
      if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
        detectedConfidence = 1
        return 'utf-16be'
      }
      let isAscii = true
      for (let i = 0; i < bytes.length; i++) {
        if (bytes[i] > 127) { isAscii = false; break }
      }
      if (isAscii) {
        detectedConfidence = 1
        detectedNote = 'ascii-only'
        return 'us-ascii'
      }
      const utf16Guess = guessUtf16WithoutBom(bytes)
      if (utf16Guess) {
        detectedConfidence = utf16Guess.confidence
        return utf16Guess.encoding
      }
      const candidates = [
        { encoding: 'utf-8', fatal: true },
        { encoding: 'gbk', fatal: false },
        { encoding: 'gb2312', fatal: false },
        { encoding: 'big5', fatal: false },
        { encoding: 'shift_jis', fatal: false },
        { encoding: 'windows-1252', fatal: false },
        { encoding: 'iso-8859-1', fatal: false },
      ]
      const results = []
      for (const candidate of candidates) {
        const decoded = tryDecode(bytes, candidate.encoding, candidate.fatal)
        if (decoded == null) continue
        results.push({ encoding: candidate.encoding, score: scoreDecodedText(decoded) })
      }
      results.sort((a, b) => b.score - a.score)
      if (results.length === 0) {
        detectedConfidence = 0
        return 'utf-8'
      }
      const best = results[0]
      const second = results[1]
      detectedConfidence = scoreToConfidence(second ? best.score - second.score : best.score)
      return best.encoding
    }

    function encodeText(text, encoding) {
      if (encoding === 'utf-8') return new TextEncoder().encode(text)
      if (encoding === 'us-ascii') {
        for (let i = 0; i < text.length; i++) {
          if (text.charCodeAt(i) > 127) throw new Error('含非 ASCII 字符，无法转为 US-ASCII')
        }
        return new TextEncoder().encode(text)
      }
      if (encoding === 'utf-16le' || encoding === 'utf-16be') {
        const le = encoding === 'utf-16le'
        const out = new Uint8Array(2 + text.length * 2)
        out[0] = le ? 0xFF : 0xFE
        out[1] = le ? 0xFE : 0xFF
        for (let i = 0; i < text.length; i++) {
          const c = text.charCodeAt(i)
          if (le) {
            out[2 + i * 2] = c & 0xFF
            out[2 + i * 2 + 1] = c >> 8
          } else {
            out[2 + i * 2] = c >> 8
            out[2 + i * 2 + 1] = c & 0xFF
          }
        }
        return out
      }
      throw new Error('不支持写出 ' + encoding)
    }

    function showPreview(text) {
      const lines = text.split('\n')
      previewContent.textContent = lines.slice(0, 20).join('\n') + (lines.length > 20 ? '\n…' : '')
    }

    async function handleFile(file) {
      currentFile = file
      const bytes = new Uint8Array(await file.arrayBuffer())
      currentBytes = bytes
      const detected = detectEncoding(bytes)
      const text = tryDecode(bytes, detected, false) ?? tryDecode(bytes, 'utf-8', false) ?? ''
      document.getElementById('fileName').textContent = file.name
      document.getElementById('fileSize').textContent = formatFileSize(file.size)
      const confidence = Number.isFinite(detectedConfidence) ? ` (${Math.round(detectedConfidence * 100)}%)` : ''
      const note = detectedNote ? ` ${detectedNote}` : ''
      document.getElementById('detectedEncoding').textContent = detected.toUpperCase() + confidence + note
      sourceEncoding.value = detected
      showPreview(text)
      workArea.classList.remove('hidden')
      showStatus('文件已加载', true)
    }

    function convertAndDownload() {
      if (!currentFile || !currentBytes) return
      try {
        const text = tryDecode(currentBytes, sourceEncoding.value, false)
        if (text == null) throw new Error('无法以 ' + sourceEncoding.value + ' 解码')
        const encoded = encodeText(text, targetEncoding.value)
        const name = currentFile.name
        const dot = name.lastIndexOf('.')
        const stem = dot > 0 ? name.slice(0, dot) : name
        const ext = dot > 0 ? name.slice(dot) : '.txt'
        const blob = new Blob([encoded], { type: 'application/octet-stream' })
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = `${stem}_${targetEncoding.value}${ext}`
        a.click()
        URL.revokeObjectURL(a.href)
        showStatus('已下载 ' + a.download, true)
      } catch (err) {
        showStatus(err.message, false)
      }
    }

    function reset() {
      currentFile = null
      currentBytes = null
      fileInput.value = ''
      workArea.classList.add('hidden')
      statusEl.className = 'text-sm hidden'
    }

    dropArea.addEventListener('click', () => fileInput.click())
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover') })
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'))
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault()
      dropArea.classList.remove('dragover')
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0])
    })
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]) })
    document.getElementById('convertBtn').addEventListener('click', convertAndDownload)
    document.getElementById('resetBtn').addEventListener('click', reset)
    sourceEncoding.addEventListener('change', () => {
      if (!currentBytes) return
      const text = tryDecode(currentBytes, sourceEncoding.value, false)
      showPreview(text ?? '（无法解码）')
    })
  </script>
</body>
</html>
