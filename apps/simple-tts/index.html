<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2064%2064'%3E%3Crect width='64' height='64' rx='14' fill='%230289d1'/%3E%3Cpath d='M12 16h40M12 48h40' stroke='rgba(255,255,255,.35)' stroke-width='4' stroke-linecap='round'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='800' fill='%23fff'%3E声%3C/text%3E%3C/svg%3E" />
  <title>语音合成 | Mecha Tools</title>
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body class="min-h-screen bg-mech-bg text-mech-text antialiased">
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <header class="sticky top-0 z-30 border-b border-mech-edge/70 backdrop-blur bg-mech-bg/70 -mx-4 px-4 py-3">
      <div class="flex items-center justify-between">
        <a class="font-semibold tracking-wider hover:text-black" href="/">Mecha Tools</a>
        <a class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 text-mech-text transition-colors" href="/">返回首页</a>
      </div>
    </header>

    <section class="bg-mech-panel border border-mech-edge rounded-xl shadow-subtle p-6 space-y-5">
      <div>
        <h1 class="text-xl font-semibold tracking-wide">语音合成</h1>
        <p class="text-mech-muted mt-2">用浏览器自带的 Web Speech API 朗读。Chrome / Edge 里不少中文音色走官方云端，打开即可用。音色因浏览器而异，无法导出音频文件。</p>
      </div>

      <label class="block text-sm font-medium">文本
        <textarea id="text" rows="6" class="mt-1 w-full border border-mech-edge rounded-md px-3 py-2" placeholder="输入要朗读的内容。Ctrl+Enter 播放。"></textarea>
      </label>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="text-sm font-medium">语言
          <select id="lang" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2">
            <option>加载中…</option>
          </select>
        </label>
        <label class="text-sm font-medium">音色
          <select id="voice" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2"></select>
        </label>
        <label class="text-sm font-medium">音调 <span id="pitchVal" class="text-sky-700 font-normal">1</span>
          <input id="pitch" type="range" min="0.5" max="2" step="0.1" value="1" class="mt-1 w-full">
        </label>
        <label class="text-sm font-medium">语速 <span id="rateVal" class="text-sky-700 font-normal">1</span>
          <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" class="mt-1 w-full">
        </label>
      </div>

      <div class="flex flex-wrap gap-2">
        <button id="playBtn" class="px-4 py-2 rounded-md bg-sky-600 hover:bg-sky-700 text-white disabled:opacity-50">播放</button>
        <button id="pauseBtn" class="px-4 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 disabled:opacity-50" disabled>暂停</button>
        <button id="stopBtn" class="px-4 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 disabled:opacity-50" disabled>停止</button>
      </div>

      <p id="status" class="text-sm text-mech-muted"></p>
    </section>
  </main>

  <script>
    const MAX_CHUNK = 180
    const PREFERRED_ZH = [/Google 普通话/, /Google 國語/, /Google.*Chinese/, /Xiaoxiao/, /Natural.*Chinese/, /Microsoft.*Chinese/]

    const textEl = document.getElementById('text')
    const langEl = document.getElementById('lang')
    const voiceEl = document.getElementById('voice')
    const pitchEl = document.getElementById('pitch')
    const rateEl = document.getElementById('rate')
    const pitchVal = document.getElementById('pitchVal')
    const rateVal = document.getElementById('rateVal')
    const playBtn = document.getElementById('playBtn')
    const pauseBtn = document.getElementById('pauseBtn')
    const stopBtn = document.getElementById('stopBtn')
    const statusEl = document.getElementById('status')

    const synth = window.speechSynthesis
    const langNames = typeof Intl !== 'undefined' && Intl.DisplayNames
      ? new Intl.DisplayNames(['zh-CN'], { type: 'language' })
      : null

    let allVoices = []
    let speakGen = 0
    let userPaused = false
    let watchdog = 0
    let selectedVoiceUri = ''

    function setStatus(msg, ok) {
      statusEl.textContent = msg
      statusEl.className = 'text-sm ' + (ok === false ? 'text-red-600' : 'text-mech-muted')
    }

    function fillSelect(el, items, selected) {
      el.replaceChildren(...items.map(([value, label]) => {
        const o = document.createElement('option')
        o.value = value
        o.textContent = label
        return o
      }))
      if (selected != null && [...el.options].some((o) => o.value === selected)) el.value = selected
    }

    function langLabel(tag) {
      try {
        return langNames ? langNames.of(tag) + ' (' + tag + ')' : tag
      } catch {
        return tag
      }
    }

    function voicesForLang(lang) {
      return allVoices.filter((v) => v.lang === lang || v.lang.startsWith(lang + '-'))
    }

    function pickVoiceUri(list) {
      if (selectedVoiceUri && list.some((v) => v.voiceURI === selectedVoiceUri)) return selectedVoiceUri
      for (const re of PREFERRED_ZH) {
        const hit = list.find((v) => re.test(v.name))
        if (hit) return hit.voiceURI
      }
      const def = list.find((v) => v.default)
      return (def || list[0] || {}).voiceURI || ''
    }

    function fillVoices() {
      const list = voicesForLang(langEl.value)
      const uri = pickVoiceUri(list)
      fillSelect(
        voiceEl,
        list.map((v) => [v.voiceURI, v.name + (v.localService ? '' : ' · 云端')]),
        uri,
      )
      selectedVoiceUri = voiceEl.value
    }

    function loadVoices() {
      const list = synth.getVoices()
      if (!list.length) return
      allVoices = list
      const langs = [...new Set(list.map((v) => v.lang))].sort((a, b) => a.localeCompare(b))
      const lang = langs.includes('zh-CN') ? 'zh-CN' : (langs.find((l) => l.startsWith('zh')) || langs[0])
      fillSelect(langEl, langs.map((l) => [l, langLabel(l)]), langEl.value && langs.includes(langEl.value) ? langEl.value : lang)
      fillVoices()
      setStatus('本机 ' + list.length + ' 个音色' + (list.some((v) => !v.localService) ? '（含云端）' : ''))
    }

    // ponytail: Chrome 单段约 15s 截断，按标点切开；超长再硬切
    function chunkText(text, maxLen = MAX_CHUNK) {
      const pieces = text.split(/([。！？.!?；;\n]+)/)
      const chunks = []
      let buf = ''
      for (const p of pieces) {
        if (!p) continue
        if (buf.length + p.length > maxLen && buf) {
          chunks.push(buf.trim())
          buf = p
        } else buf += p
      }
      if (buf.trim()) chunks.push(buf.trim())
      return chunks.flatMap((c) => {
        if (c.length <= maxLen) return [c]
        const out = []
        for (let i = 0; i < c.length; i += maxLen) out.push(c.slice(i, i + maxLen).trim())
        return out.filter(Boolean)
      })
    }

    function currentVoice() {
      return allVoices.find((v) => v.voiceURI === voiceEl.value) || null
    }

    function setTransport(playing) {
      pauseBtn.disabled = !playing
      stopBtn.disabled = !playing
      pauseBtn.textContent = userPaused ? '继续' : '暂停'
    }

    function stopWatchdog() {
      if (watchdog) clearInterval(watchdog)
      watchdog = 0
    }

    function startWatchdog() {
      stopWatchdog()
      // ponytail: Chrome 会把长朗读偷偷 pause，未点暂停时 resume
      watchdog = setInterval(() => {
        if (synth.speaking && !userPaused) synth.resume()
      }, 8000)
    }

    function stopSpeak() {
      speakGen += 1
      userPaused = false
      stopWatchdog()
      synth.cancel()
      setTransport(false)
    }

    function speakChunks(chunks, gen) {
      let i = 0
      function next() {
        if (gen !== speakGen) return
        if (i >= chunks.length) {
          stopWatchdog()
          setTransport(false)
          setStatus('播放完成')
          return
        }
        const u = new SpeechSynthesisUtterance(chunks[i++])
        const voice = currentVoice()
        if (voice) u.voice = voice
        u.rate = Number(rateEl.value)
        u.pitch = Number(pitchEl.value)
        u.onend = next
        u.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return
          stopWatchdog()
          setTransport(false)
          setStatus('朗读失败：' + e.error, false)
        }
        synth.speak(u)
        setStatus('正在朗读 ' + i + ' / ' + chunks.length)
      }
      next()
    }

    playBtn.addEventListener('click', () => {
      const text = textEl.value.trim()
      if (!text) {
        setStatus('请输入文字', false)
        return
      }
      stopSpeak()
      const chunks = chunkText(text)
      if (!chunks.length) return
      userPaused = false
      setTransport(true)
      startWatchdog()
      speakChunks(chunks, speakGen)
    })

    pauseBtn.addEventListener('click', () => {
      if (!synth.speaking && !userPaused) return
      if (userPaused) {
        userPaused = false
        synth.resume()
        startWatchdog()
        setStatus('继续朗读')
      } else {
        userPaused = true
        stopWatchdog()
        synth.pause()
        setStatus('已暂停')
      }
      setTransport(true)
    })

    stopBtn.addEventListener('click', () => {
      stopSpeak()
      setStatus('已停止')
    })

    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault()
        playBtn.click()
      }
    })

    pitchEl.addEventListener('input', () => { pitchVal.textContent = pitchEl.value })
    rateEl.addEventListener('input', () => { rateVal.textContent = rateEl.value })
    langEl.addEventListener('change', () => {
      selectedVoiceUri = ''
      fillVoices()
    })
    voiceEl.addEventListener('change', () => { selectedVoiceUri = voiceEl.value })
    window.addEventListener('pagehide', stopSpeak)

    if (!synth) {
      playBtn.disabled = true
      setStatus('当前浏览器不支持 Web Speech API', false)
    } else {
      loadVoices()
      synth.addEventListener('voiceschanged', loadVoices)
    }
  </script>
</body>

</html>
