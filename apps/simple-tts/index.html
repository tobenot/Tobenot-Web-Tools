<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2064%2064'%3E%3Crect width='64' height='64' rx='14' fill='%230289d1'/%3E%3Cpath d='M12 16h40M12 48h40' stroke='rgba(255,255,255,.35)' stroke-width='4' stroke-linecap='round'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='800' fill='%23fff'%3E声%3C/text%3E%3C/svg%3E" />
  <title>语音合成 | Mecha Tools</title>
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body class="min-h-screen bg-mech-bg text-mech-text antialiased">
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <header class="sticky top-0 z-30 border-b border-mech-edge/70 backdrop-blur bg-mech-bg/70 -mx-4 px-4 py-3">
      <div class="flex items-center justify-between">
        <a class="font-semibold tracking-wider hover:text-black" href="/">Mecha Tools</a>
        <a class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 text-mech-text transition-colors" href="/">返回首页</a>
      </div>
    </header>

    <section class="bg-mech-panel border border-mech-edge rounded-xl shadow-subtle p-6 space-y-5">
      <div>
        <h1 class="text-xl font-semibold tracking-wide">语音合成</h1>
        <p class="text-mech-muted mt-2">走 Microsoft Edge 在线语音，需联网。合成结果可播放或下载为 WebM。</p>
      </div>

      <label class="block text-sm font-medium">文本
        <textarea id="text" rows="6" class="mt-1 w-full border border-mech-edge rounded-md px-3 py-2" placeholder="输入要朗读的内容。Ctrl+Enter 播放。"></textarea>
      </label>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="text-sm font-medium">语言
          <select id="lang" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2">
            <option>加载中…</option>
          </select>
        </label>
        <label class="text-sm font-medium">音色
          <select id="voice" class="mt-1 w-full border border-mech-edge rounded-md px-2 py-2"></select>
        </label>
        <label class="text-sm font-medium">音调 <span id="pitchVal" class="text-sky-700 font-normal">0</span>
          <input id="pitch" type="range" min="-100" max="100" step="10" value="0" class="mt-1 w-full">
        </label>
        <label class="text-sm font-medium">语速 <span id="rateVal" class="text-sky-700 font-normal">0</span>
          <input id="rate" type="range" min="-100" max="100" step="10" value="0" class="mt-1 w-full">
        </label>
      </div>

      <div class="flex flex-wrap gap-2">
        <button id="playBtn" class="px-4 py-2 rounded-md bg-sky-600 hover:bg-sky-700 text-white disabled:opacity-50">播放</button>
        <button id="downloadBtn" class="px-4 py-2 rounded-md border border-mech-edge bg-white hover:bg-neutral-50 disabled:opacity-50">下载 WebM</button>
      </div>

      <p id="status" class="text-sm text-mech-muted"></p>
      <audio id="player" controls class="w-full hidden"></audio>

      <details class="text-sm text-mech-muted">
        <summary class="cursor-pointer font-medium text-mech-text">中文音色参考</summary>
        <ul class="mt-2 space-y-1 list-disc pl-5">
          <li>XiaoxiaoNeural / XiaoyiNeural：少女（后者更年幼）</li>
          <li>YunxiNeural：少年（音调调到 -15 更自然）</li>
          <li>YunxiaNeural：年轻女性</li>
          <li>YunjianNeural：大叔；YunyangNeural：正式男声</li>
        </ul>
      </details>

      <p class="text-xs text-mech-muted">
        逻辑来自 <a class="text-sky-700 underline" href="https://github.com/tobenot/simple-tts-js" target="_blank" rel="noopener">simple-tts-js</a>，
        改自 <a class="text-sky-700 underline" href="https://github.com/pansong291/ashe/blob/64e57ef33bba7125636050765a2326e7b280e6b8/html/tool/text-audio.html" target="_blank" rel="noopener">pansong291/ashe</a>。
      </p>
    </section>
  </main>

  <script>
    const TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4'
    const VOICES_URL = 'https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=' + TOKEN
    const WS_URL = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=' + TOKEN
    // ponytail: Edge 在 2024 后要求 Sec-MS-GEC；403 时再对一下 SEC_MS_GEC_VERSION
    const SEC_MS_GEC_VERSION = '1-143.0.3650.75'
    const AUDIO_HEAD = new TextEncoder().encode('Path:audio\r\n').toString()

    const textEl = document.getElementById('text')
    const langEl = document.getElementById('lang')
    const voiceEl = document.getElementById('voice')
    const pitchEl = document.getElementById('pitch')
    const rateEl = document.getElementById('rate')
    const pitchVal = document.getElementById('pitchVal')
    const rateVal = document.getElementById('rateVal')
    const playBtn = document.getElementById('playBtn')
    const downloadBtn = document.getElementById('downloadBtn')
    const statusEl = document.getElementById('status')
    const player = document.getElementById('player')

    const voicesByLang = {}
    let lastKey = ''
    let lastUrl = ''

    function signed(n) {
      return Number(n) >= 0 ? '+' + n : String(n)
    }

    function escapeXml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    function guid() {
      let out = ''
      for (let i = 0; i < 8; i++) out += (((1 + Math.random()) * 0x10000) | 0).toString(16).substring(1)
      return out
    }

    async function secMsGec() {
      const unix = BigInt(Math.floor(Date.now() / 1000))
      let ticks = unix + 11644473600n
      ticks -= ticks % 300n
      const payload = (ticks * 10000000n).toString() + TOKEN
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload))
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase()
    }

    function setStatus(msg, ok) {
      statusEl.textContent = msg
      statusEl.className = 'text-sm ' + (ok === false ? 'text-red-600' : 'text-mech-muted')
    }

    function fillSelect(el, items, selected) {
      el.replaceChildren(...items.map(([value, label]) => {
        const o = document.createElement('option')
        o.value = value
        o.textContent = label
        return o
      }))
      if (selected != null) el.value = selected
    }

    function fillVoices() {
      const list = voicesByLang[langEl.value] || []
      fillSelect(voiceEl, list.map((v, i) => [String(i), v.ShortName]), '0')
    }

    function paramsKey() {
      return JSON.stringify({
        text: textEl.value.trim(),
        lang: langEl.value,
        voice: voiceEl.value,
        pitch: pitchEl.value,
        rate: rateEl.value,
      })
    }

    async function getAudio(text, lang, voiceIndex, pitch, rate) {
      const voices = voicesByLang[lang]
      if (!voices || !voices[voiceIndex]) throw new Error('请先等待音色列表加载')
      const voiceName = voices[voiceIndex].Name
      const requestId = guid()
      const bufferList = []
      const gec = await secMsGec()
      const wsUrl = WS_URL + '&ConnectionId=' + requestId + '&Sec-MS-GEC=' + gec + '&Sec-MS-GEC-Version=' + SEC_MS_GEC_VERSION

      return new Promise((resolve, reject) => {
        const ws = new WebSocket(wsUrl)
        ws.addEventListener('open', () => {
          ws.send(
            `X-Timestamp:${new Date()}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n` +
            `{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"true"},"outputFormat":"webm-24khz-16bit-mono-opus"}}}}`
          )
          ws.send(
            `X-RequestId:${requestId}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${new Date()}\r\nPath:ssml\r\n\r\n` +
            `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='https://www.w3.org/2001/mstts' xml:lang='${lang}'>` +
            `<voice name='${voiceName}'><prosody pitch='${signed(pitch)}Hz' rate ='${signed(rate)}%' volume='+0%'>${escapeXml(text)}</prosody></voice></speak>`
          )
        })
        ws.addEventListener('message', async ({ data }) => {
          if (!(data instanceof Blob)) return
          const view = new Uint8Array(await data.arrayBuffer())
          const parts = view.toString().split(AUDIO_HEAD)
          if (parts[1]) {
            bufferList.push(...parts[1].split(',').slice(1).map((i) => +i))
          }
          if (view[0] === 0x00 && view[1] === 0x67 && view[2] === 0x58) ws.close(1000)
        })
        ws.addEventListener('error', () => {})
        ws.addEventListener('close', (event) => {
          if (event.code !== 1000) {
            reject(new Error('语音服务连接失败（' + event.code + '）'))
            return
          }
          if (!bufferList.length) {
            reject(new Error('没有收到音频'))
            return
          }
          resolve(URL.createObjectURL(new Blob([new Uint8Array(bufferList)], { type: 'audio/webm' })))
        })
      })
    }

    async function ensureAudio() {
      const text = textEl.value.trim()
      if (!text) throw new Error('请输入文字')
      const key = paramsKey()
      if (key === lastKey && lastUrl) return lastUrl
      if (lastUrl) URL.revokeObjectURL(lastUrl)
      lastUrl = await getAudio(text, langEl.value, Number(voiceEl.value), pitchEl.value, rateEl.value)
      lastKey = key
      return lastUrl
    }

    async function withBusy(fn) {
      playBtn.disabled = downloadBtn.disabled = true
      try {
        await fn()
      } catch (err) {
        setStatus(err.message || String(err), false)
      } finally {
        playBtn.disabled = downloadBtn.disabled = false
      }
    }

    playBtn.addEventListener('click', () => withBusy(async () => {
      setStatus('合成中…')
      const url = await ensureAudio()
      player.src = url
      player.classList.remove('hidden')
      await player.play()
      setStatus('')
    }))

    downloadBtn.addEventListener('click', () => withBusy(async () => {
      setStatus('合成中…')
      const url = await ensureAudio()
      const a = document.createElement('a')
      a.href = url
      a.download = 'audio_' + Date.now() + '.webm'
      a.click()
      setStatus('')
    }))

    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault()
        playBtn.click()
      }
    })

    pitchEl.addEventListener('input', () => { pitchVal.textContent = pitchEl.value })
    rateEl.addEventListener('input', () => { rateVal.textContent = rateEl.value })
    langEl.addEventListener('change', fillVoices)

    fetch(VOICES_URL)
      .then((r) => r.json())
      .then((data) => {
        for (const item of data) {
          if (!voicesByLang[item.Locale]) voicesByLang[item.Locale] = []
          voicesByLang[item.Locale].push(item)
        }
        const langs = Object.keys(voicesByLang)
        fillSelect(langEl, langs.map((l) => [l, l]), langs.includes('zh-CN') ? 'zh-CN' : langs[0])
        fillVoices()
        setStatus('已加载 ' + langs.length + ' 种语言')
      })
      .catch(() => setStatus('音色列表加载失败，请检查网络', false))
  </script>
</body>

</html>
